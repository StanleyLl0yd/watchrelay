name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Install pinned bundletool
        env:
          BUNDLETOOL_VERSION: "1.18.3"
          BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Create disposable CI signing key
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/watchrelay-ci.jks" \
            -storepass watchrelay-ci \
            -keypass watchrelay-ci \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=WatchRelay CI,O=WatchRelay,C=US"
      - name: Verify source and build signed artifacts
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/watchrelay-ci.jks
          ANDROID_KEYSTORE_PASSWORD: watchrelay-ci
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: watchrelay-ci
        run: gradle test lint assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Verify Google Play and direct-install artifacts
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          apk="app/build/outputs/apk/release/app-release.apk"
          bash scripts/verify-play-artifacts.sh "$RUNNER_TEMP/bundletool.jar" "$aab" "$apk"
          jarsigner -verify "$aab" | grep -F 'jar verified.'
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/watchrelay-ci.jks"
